[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghxdeps"
version = "0.1.0"
description = "Headless dependency manifest for Grasshopper .ghx definitions (plug-ins, components, file paths)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/ferall0gic/LIMENLABSPUBLIC"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ghx-deps = "ghxdeps.cli:entry"
ghx-deps-diff = "ghxdeps.diff:main"
ghx-groups = "ghxdeps.groups:main"
ghx-sliders = "ghxdeps.sliders:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
